services:
  - type: web
    runtime: node
    name: crm-importadoras-backend
    repo: https://github.com/crahsvanfi-rgb/CRM
    branch: main
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci --legacy-peer-deps --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://crm-importadoras.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AI_ENCRYPTION_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ZERNIO_API_KEY
        sync: false
      - key: ZERNIO_WEBHOOK_SECRET
        sync: false
